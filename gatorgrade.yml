# Nine checks: four call one class each, two run the program, two read the repository's
# history, and one reads the text of every file in src. Each class check passes on its own
# file, whatever state the others are in. Pull main before you run the checks, so you have
# every teammate's merged work.

- description: "[FEEDER] visit(birds) adds birds to visits"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_field_station.py::test_feeder_counts_visits

- description: "[RAIN GAUGE] record(millimeters) adds to total and adds 1 to readings"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_field_station.py::test_rain_gauge_totals_the_rain

- description: "[TRAIL CAMERA] photograph(animal) appends the animal to animals and stores it as last"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_field_station.py::test_trail_camera_keeps_the_animals

- description: "[CREEK GAUGE] record(level) appends the level to levels and keeps the highest"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_field_station.py::test_creek_gauge_keeps_the_highest

- description: "[MAIN] make_station returns the feeder, gauge, camera and creek, in that order"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_field_station.py::test_station_has_all_four

- description: "[MAIN] The program prints the report of every object at the station"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_field_station.py::test_main_prints_every_report

- description: "[GIT] At least five pull requests are merged with Merge pull request: one per class file, then one for main.py"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_field_station.py::test_pull_requests_were_merged

- description: "[GIT] The files in src have commits from at least two teammates"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_field_station.py::test_teammates_each_committed

- description: "[CODE] No TODO markers remain in any file in src, including the Author lines"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_field_station.py::test_no_todo_remains
